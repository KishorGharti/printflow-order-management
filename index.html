  <!-- Instant Auth Check: Redirect unauthenticated visitors directly to dedicated login portal without downloading CDNs -->
  <script>
    (function () {
      try {
        var token = localStorage.getItem('printflow_client_token_v1') || localStorage.getItem('printflow_auth_token_v1');
        var user = localStorage.getItem('printflow_current_user_v1') || localStorage.getItem('printflow_client_profile_v1');
        if (!token || !user) {
          var lastPortal = localStorage.getItem('printflow_last_portal');
          window.location.replace(lastPortal === 'employee' ? '/employee/login' : '/owner/login');
        }
      } catch (_) {}
    })();
  </script>

  <style id="printflow-theme">

    /* 2026 UI Reliability & Polish Pass — presentation only; business logic unchanged */
    ::selection {
      background: color-mix(in srgb, var(--brand-primary) 22%, white 78%);

    }

      left: 16px;

      color: #fff;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 800;

      transition: transform .15s ease;
    }

    .skip-link:focus {
      transform: translateY(0);

    /* Make the first paint feel intentional while CDN scripts initialize. */
    .app-skeleton {
      min-height: 100vh;
    }

    .app-skeleton-shell {
      display: flex;
      min-height: 100vh;
      background: #f8fafc;
    }

    .app-skeleton-side {

      min-width: 0;
      padding: 24px clamp(20px, 3vw, 48px);

    .app-skeleton-line,
    .app-skeleton-card {
      background: linear-gradient(90deg, #e9eef5 25%, #f8fafc 50%, #e9eef5 75%);
      background-size: 240% 100%;
      animation: pg-skeleton 1.4s ease-in-out infinite;
    }

    .app-skeleton-side .app-skeleton-line {
      background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
      background-size: 240% 100%;

    .app-skeleton-line {
      height: 14px;
      border-radius: 999px;
      margin-bottom: 18px;
    }

    .app-skeleton-card {
      height: 118px;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
    }

    .app-skeleton-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-top: 24px;
    }

    @keyframes pg-skeleton {
      to {
        background-position: -140% 0;
      }

    /* Honest interaction cues: not every table row is clickable. */
    tbody tr,
    .order-grid tbody tr {
      cursor: default;
    }

    button:not(:disabled),
    a[href],
    [role="button"]:not([aria-disabled="true"]) {
      cursor: pointer;
    }

    button:disabled,
    input:disabled,
    select:disabled,
    textarea:disabled {
      cursor: not-allowed !important;
      opacity: .58;
      filter: saturate(.7);
    }

    button:disabled:hover {
      filter: saturate(.7);
      transform: none;
    }

    /* Cleaner navigation state without changing routes or actions. */
    .app-sidebar nav button {
      position: relative;
    }

    .app-sidebar nav button[aria-current="page"]::before {
      content: "";
      position: absolute;
      left: -6px;
      top: 25%;
      bottom: 25%;
      width: 3px;
      border-radius: 999px;
      background: var(--brand-accent);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--brand-accent) 30%, transparent);

    /* Data-heavy screens: stronger reading rhythm and steadier numbers. */
    table {
      font-variant-numeric: tabular-nums;
    }

    thead th {
      border-bottom: 1px solid #e2e8f0 !important;
    }

    tbody tr:last-child td {
      border-bottom-color: transparent !important;
    }

    td[class*="font-mono"],
    .font-mono {
      font-variant-numeric: tabular-nums slashed-zero;
    }

    .overflow-x-auto {
      overscroll-behavior-inline: contain;
      scrollbar-gutter: stable;

    label {
      color: #475569;
    }

    input[type="checkbox"],

      accent-color: var(--brand-primary);
    }

    input[type="file"]::file-selector-button {
      border: 0;
      border-radius: 8px;
      margin-right: 10px;
      padding: 7px 10px;
      background: #eef2ff;
      color: #4338ca;
      font: inherit;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    /* Prevent accidental text selection on controls while preserving table copy/paste. */
    button,
    nav,
    [role="tab"] {
      user-select: none;
    }

    /* Dark-mode corrections for newly standardized primitives. */
    html[data-theme="dark"] .app-skeleton-shell {

    html[data-theme="dark"] .app-skeleton-card,
    html[data-theme="dark"] .app-skeleton-main .app-skeleton-line {

      color: #cbd5e1;
    }

    }

      input:not([type="checkbox"]):not([type="radio"]):not([type="color"]),

    @media print {
      @page {
        size: auto;
        margin: 8mm;

      .skip-link,
      .app-sidebar,
      header,
      nav,
      #mobile-navigation,
      button,
      .modal-backdrop,
      button[aria-label="Back to top"] {
        display: none !important;
      }

      body,
      html {
        background: #fff !important;
        color: #0f172a !important;
        width: 100% !important;
        height: auto !important;
        overflow: visible !important;
      }

      .doc-live-sheet,
      .printable-slip,
      .receipt-container {
        width: 100% !important;
        max-width: 100% !important;
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }

      table {
        page-break-inside: auto;
      }

      tr {
        page-break-inside: avoid;
        page-break-after: auto;
      }
    }

    /* Accessibility */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.001ms !important;

    /* Global Bill & Chalan design settings preview */
    .doc-preview-stage {

    }

    .doc-preview-logo.logo-small {
      height: 28px;
    }

    .doc-preview-logo.logo-medium {
      height: 42px;
    }

    .doc-preview-logo.logo-large {
      height: 58px;
    }

    .doc-company {
      font-size: 1.5em;
      font-weight: 900;
      letter-spacing: -.03em;
    }

    .doc-muted {
      color: #64748b;
      font-size: .78em;
      margin-top: 2px;

    }

    .doc-preview-title {
      text-align: right;
      color: #64748b;

      flex-direction: column;
      gap: 3px;
    }

    .style-centered .doc-preview-title {
      text-align: center;
    }

    .doc-preview-title strong {
      color: var(--doc-accent);
      font-size: 1.5em;
      text-transform: uppercase;
    }

    .doc-bold .doc-preview-title strong,
    .doc-bold .doc-company {
      font-weight: 900;

    }

    .doc-minimal .doc-preview-header {

    .doc-minimal .doc-preview-title strong,
    .doc-minimal .doc-company {
      font-weight: 600;

    .doc-customer {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));

      margin: 16px 0;

    .doc-customer small {

    .doc-customer span {

    }

    .doc-preview-table {

    }

    .doc-preview-table th {

      color: #fff !important;
      text-align: left;
      font-size: .82em !important;
    }

    .doc-preview-table.header-outline th {
      background: #fff !important;

    .doc-preview-table td {

    .doc-preview-table.with-borders td,

    }

    .doc-preview-table.with-zebra tbody tr:nth-child(even) td {
      background: #f8fafc;
    }

    .doc-preview-summary {
      margin: 18px 0 0 auto;
      width: min(100%, 310px);
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 11px;
      color: #475569;
      border-top: 2px solid var(--doc-accent);

    .doc-preview-summary strong {
      color: var(--doc-accent);
    }

    .doc-preview-note {
      margin-top: 16px;
      padding: 10px;
      border: 1px dashed var(--doc-accent);
      color: #475569;
      border-radius: 6px;
    }

    .doc-preview-signatures {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 36px;
      margin-top: 70px;
    }

    .doc-preview-signatures span {
      border-top: 1px solid #94a3b8;

    }

    .doc-preview-thanks,
    .doc-preview-footer {
      margin-top: 18px;
      text-align: center;
      color: #64748b;
      font-size: .8em;
      overflow-wrap: anywhere;
    }

    .doc-preview-footer {
      border-top: 1px solid #e2e8f0;
      padding-top: 7px;
    }

    @container (max-width: 440px) {
      .doc-preview-header {
        grid-template-columns: 1fr;
      }

    @media (max-width: 640px) {

    .designer-panel {

  </style>
</head>

<body class="bg-slate-100/70 text-slate-900 font-sans antialiased min-h-screen">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <!-- Mounting Root. Static skeleton is replaced automatically when React mounts. -->
  <div id="root" class="app-skeleton">
    <div class="app-skeleton-shell" aria-hidden="true">
      <div class="app-skeleton-side">
        <div class="app-skeleton-line" style="width:72%;height:34px;margin-bottom:34px"></div>
        <div class="app-skeleton-line" style="width:84%"></div>

        <div class="app-skeleton-line" style="width:min(420px,72%);height:40px"></div>
        <div class="app-skeleton-grid">
          <div class="app-skeleton-card"></div>
          <div class="app-skeleton-card"></div>
          <div class="app-skeleton-card"></div>

        </div>
        <div class="app-skeleton-card" style="height:330px;margin-top:18px"></div>
      </div>
    </div>
  </div>

  <!-- React 18 & ReactDOM 18 UMD Scripts (Compatible with file:// and http://) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Nepali BS calendar picker -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nepali-bs-date-picker/dist/nepali-date-picker.min.css">
  <script src="https://cdn.jsdelivr.net/npm/nepali-bs-date-picker/dist/nepali-date-picker.min.js"></script>

  <!-- Accurate AD ↔ BS date conversion -->
  <script src="https://cdn.jsdelivr.net/npm/nepali-date-converter@3.4.0/dist/nepali-date-converter.umd.js"></script>

  <!-- Client-side PDF generator; the app keeps an offline fallback. -->
  <script src="https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js"></script>

  <!-- Bundled Print Ghar Application Script -->
  <script src="./dist/app.js?v=20260928-rbac-backend-enforce"></script>
  <script>
    // If required CDN/browser libraries fail before React mounts, show a recovery screen instead of a blank page.
    window.setTimeout(function () {
      var root = document.getElementById('root');
      if (!root || !root.querySelector('.app-skeleton-shell')) return;
      root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f8fafc;font-family:Arial,sans-serif"><div style="max-width:560px;background:white;border:1px solid #fecaca;border-radius:16px;padding:24px;box-shadow:0 12px 32px rgba(15,23,42,.08)"><div style="font-size:12px;font-weight:800;color:#dc2626;text-transform:uppercase">Print Ghar could not start</div><h2 style="margin:8px 0;color:#0f172a">Required browser libraries did not load.</h2><p style="color:#475569;line-height:1.6">Check your internet connection, then reload this page. Your saved browser data has not been deleted.</p><button onclick="location.reload()" style="margin-top:8px;border:0;border-radius:10px;background:#0f172a;color:white;padding:10px 16px;font-weight:800;cursor:pointer">Reload App</button></div></div>';
    }, 7000);
  </script>

  <!-- Real-Time Maintenance Mode Interceptor Screen -->
  <div id="maintenance-overlay" style="display:none;position:fixed;inset:0;z-index:999999;background:rgba(15,23,42,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);align-items:center;justify-content:center;padding:20px;font-family:'Plus Jakarta Sans',sans-serif">
    <div style="max-width:500px;width:100%;background:#ffffff;border-radius:28px;box-shadow:0 30px 60px -15px rgba(0,0,0,0.5);border:1px solid #e2e8f0;padding:36px;text-align:center;animation:maintPop 0.3s cubic-bezier(0.16, 1, 0.3, 1)">
      <div style="width:68px;height:68px;border-radius:22px;background:#fef3c7;color:#d97706;display:flex;align-items:center;justify-content:center;margin:0 auto 20px auto;box-shadow:0 8px 20px rgba(217,119,6,0.15)">
        <svg style="width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      </div>
      <div style="display:inline-block;padding:4px 14px;background:#fef3c7;color:#92400e;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:12px">Maintenance Mode Active</div>
      <h2 style="font-size:22px;font-weight:900;color:#0f172a;margin-bottom:12px;line-height:1.25">System Temporarily Offline</h2>
      <p id="maintenance-overlay-msg" style="color:#64748b;font-size:13.5px;line-height:1.6;margin-bottom:28px">The system is currently undergoing scheduled maintenance. Please check back shortly.</p>
      <div style="display:flex;justify-content:center">
        <button onclick="location.reload()" style="padding:12px 32px;border-radius:14px;background:#0f172a;color:#ffffff;font-size:13px;font-weight:800;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(15,23,42,0.25);transition:all 0.2s ease" onmouseover="this.style.transform='translateY(-1px)'" onmouseout="this.style.transform='translateY(0)'">Retry Connection</button>
      </div>
    </div>
  </div>
  <style>
    @keyframes maintPop {
      0% { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
  <script>
    window.addEventListener('printflow:maintenance-mode', function (e) {
      var overlay = document.getElementById('maintenance-overlay');
      var msg = document.getElementById('maintenance-overlay-msg');
      if (overlay) {
        if (e && e.detail && msg) msg.textContent = e.detail;
        overlay.style.display = 'flex';
      }
    });
  </script>
